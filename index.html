<!doctype html>
<html lang="hr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070A11" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="description" content="SalesBoard — interna prodajna analitika za CCOW" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" />
    <script>
      // Apply the stored theme before first paint so there is no light/dark flash.
      try { if (localStorage.getItem('sb-theme') === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="theme-color"]').content = '#F5F7FB'; } } catch (error) {}
    </script>
    <title>SalesBoard · CCOW</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
